<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crafty Beshies Barcode Scanner</title>
<style>
:root{--pink:#ffcbe1;--lav:#dcccec;--text:#51455a;--muted:#806f83;--green:#d6e5bd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:linear-gradient(135deg,#fff7fb,#f4eff9);font-family:Arial,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center}
.card{width:min(560px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(80,60,90,.14)}
h1{margin:0 0 8px;font-size:24px}
p{color:var(--muted);line-height:1.45}
.video-wrap{position:relative;background:#111;border-radius:18px;overflow:hidden;aspect-ratio:4/3;margin:18px 0 14px}
video{width:100%;height:100%;object-fit:cover;display:block}
.line{position:absolute;left:10%;right:10%;top:50%;height:3px;background:#ff8fbe;box-shadow:0 0 8px rgba(255,143,190,.8)}
.status,.result{padding:12px 14px;border-radius:14px;background:#f7f1f6;color:var(--muted);font-size:14px;min-height:44px}
.result{display:none;background:var(--green);color:var(--text);font-weight:700}
button{width:100%;min-height:48px;border:0;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;background:var(--lav);color:var(--text)}
.small{font-size:12px}
</style>
</head>
<body>
<main class="card">
<h1>📷 Crafty Beshies Barcode Scanner</h1>
<p>Point the camera at a Crafty Beshies <strong>Code 128</strong> product barcode. The scanner reads Product IDs such as <strong>CB028</strong>.</p>

<div class="video-wrap">
  <video id="preview" autoplay muted playsinline></video>
  <div class="line"></div>
</div>

<div id="status" class="status" aria-live="polite">Loading barcode scanner…</div>
<div id="result" class="result" aria-live="polite"></div>
<button id="restartBtn" type="button" style="margin-top:12px">🔄 Restart Scanner</button>

<p class="small">ZXing is hosted locally in this GitHub repository. No barcode-library CDN is required.</p>
</main>

<!-- These two files will be generated into the repository by the GitHub Action. -->
<script src="vendor/zxing-library.min.js"></script>
<script src="vendor/zxing-browser.min.js"></script>

<script>
(function(){
  const video = document.getElementById('preview');
  const status = document.getElementById('status');
  const resultBox = document.getElementById('result');
  const restartBtn = document.getElementById('restartBtn');

  let controls = null;
  let starting = false;
  let lastText = '';

  function setStatus(message){
    status.textContent = message;
  }

  function showResult(text){
    resultBox.style.display = 'block';
    resultBox.textContent = '✅ Barcode detected: ' + text;
  }

  function stopScanner(){
    try {
      if (controls && typeof controls.stop === 'function') controls.stop();
    } catch(e) {}
    controls = null;
  }

  async function startScanner(){
    if (starting) return;
    starting = true;
    stopScanner();
    resultBox.style.display = 'none';
    lastText = '';

    if (!window.ZXing) {
      setStatus('❌ ZXing core library was not loaded.');
      starting = false;
      return;
    }
    if (!window.ZXingBrowser) {
      setStatus('❌ ZXing browser library was not loaded.');
      starting = false;
      return;
    }

    try {
      setStatus('Starting camera…');

      const Reader = window.ZXingBrowser.BrowserMultiFormatReader;
      if (!Reader) throw new Error('BrowserMultiFormatReader is unavailable.');

      const codeReader = new Reader();

      const devices = await window.ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      if (!devices || !devices.length) throw new Error('No camera was found.');

      // Prefer a rear/environment camera on phones/tablets.
      let selected = devices.find(d =>
        /back|rear|environment/i.test(d.label || '')
      ) || devices[devices.length - 1];

      setStatus('📷 Camera ready — point it at CB028.');

      controls = await codeReader.decodeFromVideoDevice(
        selected.deviceId,
        video,
        (decoded, error) => {
          if (decoded) {
            const text = decoded.getText();
            if (text && text !== lastText) {
              lastText = text;
              showResult(text);
              setStatus('🎉 Successfully decoded the barcode.');
              // Stop after the first successful read.
              stopScanner();

              // If Owner Product Management launched this scanner,
              // return the scanned Product ID to the Owner Portal.
              const params = new URLSearchParams(window.location.search);
              const returnUrl = params.get('returnUrl');

              if (returnUrl) {
                try {
                  const target = new URL(returnUrl);

                  // Only allow an Apps Script web-app return URL.
                  if (!/^(script\.google\.com|script\.googleusercontent\.com)$/i.test(target.hostname)) {
                    throw new Error('Invalid return URL.');
                  }

                  target.searchParams.set('barcode', text);
                  target.searchParams.set('scanSource', 'external');
                  window.location.href = target.toString();
                  return;
                } catch (e) {
                  console.error('Unable to return to Owner Portal:', e);
                }
              }
            }
          }
        }
      );

    } catch(err) {
      console.error(err);
      setStatus('❌ Scanner error: ' + (err && err.message ? err.message : String(err)));
    } finally {
      starting = false;
    }
  }

  restartBtn.addEventListener('click', startScanner);
  window.addEventListener('load', startScanner);
})();
</script>
</body>
</html>
