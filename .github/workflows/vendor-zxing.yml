name: Vendor ZXing Libraries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-zxing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZXing packages
        run: |
          mkdir -p vendor
          npm pack @zxing/library@0.23.0
          npm pack @zxing/browser@0.2.1

      - name: Extract browser-ready UMD files
        run: |
          rm -rf /tmp/zxing-library /tmp/zxing-browser
          mkdir -p /tmp/zxing-library /tmp/zxing-browser

          tar -xzf zxing-library-0.23.0.tgz -C /tmp/zxing-library
          tar -xzf zxing-browser-0.2.1.tgz -C /tmp/zxing-browser

          cp /tmp/zxing-library/package/umd/index.min.js vendor/zxing-library.min.js
          cp /tmp/zxing-browser/package/umd/zxing-browser.min.js vendor/zxing-browser.min.js

          test -s vendor/zxing-library.min.js
          test -s vendor/zxing-browser.min.js

      - name: Commit vendored libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/
          git diff --cached --quiet || git commit -m "Add local ZXing barcode libraries"
          git push
