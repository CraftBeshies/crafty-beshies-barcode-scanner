<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crafty Beshies Barcode Scanner</title>
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
  <style>
    :root {
      --pink:#ffcbe1;
      --lavender:#dcccec;
      --blue:#bcd8ec;
      --text:#51455a;
      --muted:#806f83;
      --white:#fff;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#fff7fb,#f4eff9);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .card {
      width:min(560px,100%);
      background:var(--white);
      border-radius:24px;
      padding:22px;
      box-shadow:0 10px 30px rgba(80,60,90,.14);
    }
    h1 { margin:0 0 8px; font-size:24px; }
    p { color:var(--muted); line-height:1.45; }
    .video-wrap {
      position:relative;
      overflow:hidden;
      border-radius:18px;
      background:#111;
      aspect-ratio:4/3;
      margin:18px 0 14px;
    }
    video {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .line {
      position:absolute;
      left:12%;
      right:12%;
      top:50%;
      height:3px;
      background:#ff8fbe;
      box-shadow:0 0 8px rgba(255,143,190,.8);
    }
    .status {
      padding:12px 14px;
      border-radius:14px;
      background:#f7f1f6;
      color:var(--muted);
      font-size:14px;
      min-height:44px;
    }
    .result {
      display:none;
      margin-top:12px;
      padding:14px;
      border-radius:14px;
      background:#eef7ea;
      font-weight:700;
    }
    button {
      width:100%;
      min-height:48px;
      border:0;
      border-radius:14px;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      background:var(--lavender);
      color:var(--text);
    }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .small { font-size:12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📷 Crafty Beshies Barcode Scanner</h1>
    <p>Point the camera at a Crafty Beshies product barcode. The scanner will read the Product ID, such as <strong>CB028</strong>.</p>

    <div class="video-wrap">
      <video id="preview" autoplay muted playsinline></video>
      <div class="line"></div>
    </div>

    <div id="status" class="status" aria-live="polite">Starting camera…</div>
    <div id="result" class="result"></div>

    <button id="closeBtn" type="button" style="margin-top:12px;">Close Scanner</button>
    <p class="small">Camera access requires HTTPS and permission from the browser.</p>
  </main>

<script>
(function () {
  const video = document.getElementById('preview');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const closeBtn = document.getElementById('closeBtn');

  let reader = null;
  let controls = null;
  let finished = false;

  const params = new URLSearchParams(window.location.search);
  const returnUrl = params.get('returnUrl') || '';

  function setStatus(message) {
    status.textContent = message;
  }

  function stopScanner() {
    try {
      if (controls && typeof controls.stop === 'function') controls.stop();
    } catch (_) {}
    controls = null;

    try {
      if (reader && typeof reader.reset === 'function') reader.reset();
    } catch (_) {}

    try {
      const stream = video.srcObject;
      if (stream && typeof stream.getTracks === 'function') {
        stream.getTracks().forEach(track => track.stop());
      }
      video.srcObject = null;
    } catch (_) {}
  }

  function closeScanner() {
    stopScanner();
    if (window.opener && !window.opener.closed) {
      window.close();
    } else {
      history.back();
    }
  }

  function finish(barcode) {
    if (finished) return;
    finished = true;
    stopScanner();

    result.style.display = 'block';
    result.textContent = 'Scanned: ' + barcode;
    setStatus('Barcode found. Returning to Crafty Beshies…');

    if (returnUrl) {
      try {
        const url = new URL(returnUrl);
        url.searchParams.set('barcode', barcode);
        window.location.href = url.toString();
        return;
      } catch (_) {
        setStatus('Barcode found, but the return address is invalid.');
      }
    }

    // Standalone test mode: leave the result visible if no return URL was supplied.
  }

  async function startScanner() {
    if (!window.isSecureContext) {
      setStatus('Camera requires a secure HTTPS page. Please open this scanner using HTTPS.');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('This browser does not provide camera access through this page.');
      return;
    }

    if (!window.ZXingBrowser) {
      setStatus('Barcode scanner library could not be loaded. Please check the internet connection and try again.');
      return;
    }

    try {
      // Ask the browser for a camera first, without forcing a specific camera.
      const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      setStatus('Camera ready. Point it at the CB barcode…');

      reader = new ZXingBrowser.BrowserMultiFormatReader();

      controls = await reader.decodeFromVideoElement(video, (scanResult, error) => {
        if (scanResult) {
          finish(scanResult.getText());
        }
      });
    } catch (error) {
      const name = error && error.name ? error.name : 'UnknownError';
      const message = error && error.message ? error.message : String(error || '');
      setStatus('Camera error (' + name + '): ' + message);
    }
  }

  closeBtn.addEventListener('click', closeScanner);
  startScanner();
})();
</script>
</body>
</html>
